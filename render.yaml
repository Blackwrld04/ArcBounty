services:
  - type: web
    name: arcbounty-facilitator
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4050"
      - key: ARC_RPC_URL
        value: https://rpc.mainnet.arc.io
      - key: ARC_CHAIN_ID
        value: "5042"
      - key: FACILITATOR_PRIVATE_KEY
        sync: false
      - key: ESCROW_CONTRACT_ADDRESS
        value: "0x7Cd0F0db26f47dFa757014a8f756506B9F32F823"
      - key: DATABASE_URL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAILS
        value: "olajideabdulquadri22@gmail.com"
      - key: ADMIN_PASSWORD
        sync: false
